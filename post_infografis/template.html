<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      color: #f5f2eb;
      overflow: hidden;
    }
    /* Fauna: cokelat hangat | Flora: hijau hutan */
    body.fauna { background: #151311; }
    body.flora { background: #0d1713; }

    /* ===== FOTO: 75% tinggi (810px), bersih tanpa teks ===== */
    .hero {
      position: relative;
      height: 810px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-credit {
      position: absolute;
      top: 14px; right: 14px;
      background: rgba(0,0,0,0.6);
      color: #cbd5e0;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 4px;
      z-index: 2;
    }

    /* ===== TEKS: 25% tinggi (270px), di bawah ===== */
    .content {
      height: 270px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 48px;
    }

    .badge-row {
      display: flex;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      background: #d97706;
      color: #1a0f05;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 4px 10px;
      border-radius: 6px;
    }
    body.flora .badge { background: #38a169; color: #0b1d14; }
    .badge-iucn {
      display: inline-block;
      background: rgba(255,255,255,0.08);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(251,191,36,0.5);
    }
    body.flora .badge-iucn { color: #86efac; border-color: rgba(134,239,172,0.5); }

    .title {
      font-size: 42px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .latin {
      font-size: 18px;
      font-style: italic;
      color: #d1d5db;
      margin-top: 2px;
    }

    /* Satu fakta unggulan, ringkas */
    .headline {
      border-left: 6px solid #d97706;
      padding-left: 14px;
    }
    body.flora .headline { border-left-color: #48bb78; }
    .headline-text {
      font-size: 20px;
      color: #e2e8f0;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .headline-text strong {
      color: #f59e0b;
    }
    body.flora .headline-text strong { color: #68d391; }

    /* Footer: habitat + CTA sebaris */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 10px;
    }
    .habitat-tag {
      font-size: 15px;
      color: #cbd5e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65%;
    }
    .cta {
      font-size: 16px;
      font-weight: 700;
      color: #f59e0b;
      white-space: nowrap;
    }
    body.flora .cta { color: #68d391; }
  </style>
</head>
<body class="{{ category.lower() }}">

  <!-- FOTO: 75%, bersih -->
  <div class="hero">
    <img src="{{ image_url }}" alt="{{ name }}">
    <div class="photo-credit">Foto: {{ image_source }}</div>
  </div>

  <!-- TEKS: 25%, di bawah -->
  <div class="content">
    <div>
      <div class="badge-row">
        <div class="badge">{{ category }} &bull; Pulau Jawa</div>
        <div class="badge-iucn">🛡️ {{ iucn_status }}</div>
      </div>
      <div class="title">{{ name }}</div>
      <div class="latin">{{ latin_name }}</div>
    </div>

    <div class="headline">
      <div class="headline-text"><strong>{{ facts[0].title }}:</strong> {{ facts[0].desc }}</div>
    </div>

    <div class="footer">
      <div class="habitat-tag">📍 {{ habitat }}</div>
      <div class="cta">Follow untuk satwa lainnya 🐾</div>
    </div>
  </div>

</body>
</html>
