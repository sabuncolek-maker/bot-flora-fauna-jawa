<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* Warna bawaan untuk Fauna (Nuansa Tanah & Cokelat Hangat) */
    body {
      width: 1080px;
      height: 1080px;
      background: #151311;
      color: #f5f2eb;
      display: flex;
      flex-direction: column;
      padding: 50px 60px;
      border: 12px solid #6e472b;
      justify-content: space-between;
    }
    
    /* Pengalihan warna otomatis jika kategori adalah Flora (Nuansa Hijau Hutan) */
    body.flora {
      background: #0d1713;
      color: #f0f4f1;
      border-color: #2d5a46;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 18px;
    }
    .badge-container {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      background: #d97706;
      color: #1a0f05;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 5px 12px;
      border-radius: 6px;
    }
    body.flora .badge {
      background: #38a169;
      color: #0b1d14;
    }
    .badge-iucn {
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      color: #fbbf24;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(251, 191, 36, 0.4);
    }
    body.flora .badge-iucn {
      color: #86efac;
      border-color: rgba(134, 239, 172, 0.4);
    }
    .title {
      font-size: 46px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .latin {
      font-size: 22px;
      font-style: italic;
      color: #a0aec0;
      margin-top: 4px;
    }
    .main-content {
      display: flex;
      gap: 30px;
      margin: 25px 0;
      height: 660px;
    }
    .image-box {
      flex: 1.1;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #6e472b;
      background: #231c18;
      position: relative;
    }
    body.flora .image-box {
      border-color: #2d5a46;
      background: #1a2e24;
    }
    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-credit {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #cbd5e0;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }
    .facts-box {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 15px;
    }
    .fact-card {
      background: rgba(255, 255, 255, 0.05);
      border-left: 6px solid #d97706;
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
    }
    body.flora .fact-card {
      border-left-color: #48bb78;
    }
    .fact-title {
      font-size: 20px;
      font-weight: 700;
      color: #f59e0b;
      margin-bottom: 4px;
    }
    body.flora .fact-title {
      color: #68d391;
    }
    .fact-desc {
      font-size: 18px;
      line-height: 1.35;
      color: #e2e8f0;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      padding-top: 18px;
    }
    .habitat-tag {
      font-size: 18px;
      color: #cbd5e0;
      background: rgba(255,255,255,0.07);
      padding: 6px 16px;
      border-radius: 6px;
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #d97706;
    }
    body.flora .brand {
      color: #48bb78;
    }
  </style>
</head>
<body class="{{ category.lower() }}">
  <div class="header">
    <div>
      <div class="badge-container">
        <div class="badge">{{ category }} &bull; PULAU JAWA</div>
        <div class="badge-iucn">🛡️ {{ iucn_status }}</div>
      </div>
      <div class="title">{{ name }}</div>
      <div class="latin">{{ latin_name }}</div>
    </div>
  </div>

  <div class="main-content">
    <div class="image-box">
      <img src="{{ image_url }}" alt="{{ name }}">
      <div class="photo-credit">📷 Wikimedia Commons / CC-BY-SA</div>
    </div>
    <div class="facts-box">
      {% for fact in facts %}
      <div class="fact-card">
        <div class="fact-title">{{ fact.title }}</div>
        <div class="fact-desc">{{ facts_desc or fact.desc }}</div>
      </div>
      {% endfor %}
    </div>
  </div>

  <div class="footer">
    <div class="habitat-tag">📍 Habitat: {{ habitat }}</div>
    <div class="brand">Indo Bizarre</div>
  </div>
</body>
</html>
