name: Generate Reels Video 30 Detik

on:
  workflow_dispatch: # Pemicu tombol manual untuk pengetesan

jobs:
  build-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pasang FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Jalankan Render Reels
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd post_reels
          python generate_reels.py

      - name: Simpan Hasil Video ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-reels-30-detik
          path: post_reels/reels_30detik.mp4
