name: Generate & Post Reels 30 Detik

on:
  workflow_dispatch:
  schedule:
    # 23:37 WIB (16:37 UTC)
    - cron: '37 16 * * *'
    # 02:43 WIB (19:43 UTC)
    - cron: '43 19 * * *'
    # 05:21 WIB (22:21 UTC - dimajukan agar sebelum jam 6 pagi sudah selesai)
    - cron: '21 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pasang FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Jalankan Render dan Posting Reels
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd post_reels
          python generate_reels.py

      - name: Simpan Catatan Riwayat ke Repositori
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add post_reels/history_reels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update riwayat satwa reels [skip ci]" && git push)
