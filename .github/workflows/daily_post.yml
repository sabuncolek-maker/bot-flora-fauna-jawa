name: Auto Post Flora Fauna Jawa

on:
  workflow_dispatch:
  schedule:
    # Jam 07:14 WIB (00:14 UTC - geser 14 menit agar lepas dari antrean midnight)
    - cron: '14 0 * * *'
    # Jam 12:38 WIB (05:38 UTC)
    - cron: '38 5 * * *'
    # Jam 19:42 WIB (12:42 UTC)
    - cron: '42 12 * * *'

concurrency:
  group: flora-fauna-infografis
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Binary Browser Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Jalankan Script Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd post_infografis
          python generate_and_post.py

      - name: Simpan Riwayat Spesies
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add post_infografis/posted.txt
          # [skip ci] mencegah server memicu tugas berulang saat file riwayat disimpan
          git commit -m "Update riwayat spesies harian [skip ci]" || exit 0
          git pull --rebase origin main && git push
