name: Mitos vs Fakta Carousel

on:
  # Jadwal otomatis DIMATIKAN dulu untuk tes manual.
  # Aktifkan lagi setelah tes berhasil dengan menghapus tanda # di bawah:
  # schedule:
  #   - cron: '17 3 * * 3,6'  # Rabu & Sabtu jam 10:00 WIB
  workflow_dispatch:  # Tombol "Run workflow" untuk tes manual

jobs:
  mitos-fakta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Jalankan bot Mitos vs Fakta
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python post_mitos_fakta/generate_mitos.py

      - name: Simpan history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_mitos_fakta/history_mitos.json
          git diff --staged --quiet || git commit -m "Update riwayat mitos [skip ci]"
          git push
